name: Manual performance benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Exact benchmark profile
        required: true
        type: choice
        options:
          - import-1000
          - import-10000
          - import-50000
          - import-100000
          - import-250000
          - import-500000
          - optimization-100
          - optimization-500
          - optimization-1000
          - optimization-5000
          - optimization-10000
          - optimization-25000

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: seatplan_benchmark
          POSTGRES_USER: seatplan
          POSTGRES_PASSWORD: benchmark_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seatplan -d seatplan_benchmark"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://seatplan:benchmark_only_password@localhost:5432/seatplan_benchmark
      BENCHMARK_DATABASE_URL: postgresql+psycopg://seatplan:benchmark_only_password@localhost:5432/seatplan_benchmark
      BENCHMARK_ALLOW_WRITES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply PostgreSQL migrations
        run: python -m flask --app app db upgrade
      - name: Run selected benchmark
        env:
          BENCHMARK_PROFILE: ${{ inputs.profile }}
        run: |
          case "$BENCHMARK_PROFILE" in
            import-*) python -m benchmarks.import_benchmark --sizes "${BENCHMARK_PROFILE#import-}" ;;
            optimization-*) python -m benchmarks.optimization_benchmark --sizes "${BENCHMARK_PROFILE#optimization-}" ;;
            *) echo "Unsupported benchmark profile" >&2; exit 2 ;;
          esac
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.profile }}-${{ github.sha }}
          path: benchmark-results/*.json
          if-no-files-found: error
          retention-days: 30
