name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Apply migrations
        env:
          APP_ENV: development
          DATABASE_URL: sqlite:///ci.db
        run: python -m flask --app app db upgrade
      - name: Run test suite
        env:
          APP_ENV: development
          DATABASE_URL: sqlite:///ci.db
        run: python -m unittest discover -s tests -v

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: seatplan_test
          POSTGRES_USER: seatplan
          POSTGRES_PASSWORD: seatplan_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seatplan -d seatplan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: production
      SECRET_KEY: production-ci-secret-key-with-more-than-32-characters
      DATABASE_URL: postgresql+psycopg://seatplan:seatplan_test_password@localhost:5432/seatplan_test
      SESSION_COOKIE_SECURE: "true"
      ALLOWED_HOSTS: localhost
      RUN_POSTGRES_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply PostgreSQL migrations
        run: python -m flask --app app db upgrade
      - name: Check migration drift
        run: python -m flask --app app db check
      - name: Run PostgreSQL integration checks
        run: python tests/test_postgres_integration.py -v

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag smart-seating:${{ github.sha }} .
