[project]
name = "smart-seating-arrangement"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.0.0",
  "Flask-Login>=0.6,<1",
  "Flask-Limiter==3.12",
  "Flask-SQLAlchemy>=3.1,<4",
  "Flask-Migrate>=4.0,<5",
  "Flask-WTF>=1.2,<2",
  "boto3>=1.43,<2",
  "celery[redis]>=5.6,<5.7",
  "gunicorn>=23,<24",
  "networkx>=3.0",
  "ortools>=9.15,<9.16",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=5,<7",
  "reportlab>=4,<5",
  "redis>=7.2,<9",
  "sympy>=1.12",
]

[tool.vercel.scripts]
build = "python -m flask --app app db upgrade"

