[project]
name = "smart-seating-arrangement"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.0.0",
  "Flask-Login>=0.6,<1",
  "Flask-SQLAlchemy>=3.1,<4",
  "Flask-Migrate>=4.0,<5",
  "Flask-WTF>=1.2,<2",
  "gunicorn>=23,<24",
  "networkx>=3.0",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "reportlab>=4,<5",
  "sympy>=1.12",
]

[tool.vercel.scripts]
build = "python -m flask --app app db upgrade"
